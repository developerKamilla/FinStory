<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>FinStory — курс о деньгах</title>
<style>
:root{--ink:#231d20;--sub:#74696d;--paper:#fffafb;--line:#f0e3e6;--purple:#dd2442;--lav:#fff0f2;--peach:#ffe9d9;--green:#e8f5e7}
*{box-sizing:border-box}body{margin:0;font:15px/1.55 system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:var(--ink);background:#f7edf0}
button,textarea{font:inherit}button{cursor:pointer}button:focus-visible,textarea:focus-visible{outline:3px solid #fa8fa1;outline-offset:2px}
.shell{max-width:470px;min-height:100vh;margin:0 auto;background:var(--paper);box-shadow:0 16px 65px #6b13300f;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;padding:22px 25px 13px}.logo{font-size:21px;font-weight:850;letter-spacing:-.7px;display:inline-flex;align-items:center;gap:8px}.brand-mark{width:31px;height:28px;object-fit:contain}
main{padding:24px 25px 42px;flex:1}h1,h2,h3{line-height:1.2;letter-spacing:-.55px}h1{font-size:31px;margin:0 0 12px}h2{font-size:24px;margin:0 0 10px}h3{font-size:17px;margin:0 0 12px}p{margin:0 0 16px}.muted{color:var(--sub)}.eyebrow{font-size:12px;font-weight:750;color:var(--purple);text-transform:uppercase;letter-spacing:1px;margin-bottom:12px}
.card{background:white;border:1px solid var(--line);border-radius:18px;padding:18px;margin:14px 0}.soft{background:var(--lav);border-color:transparent}.warm{background:#fff7f7;border-color:#f8e2e5}.card p:last-child{margin-bottom:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);border-radius:12px;background:white;color:var(--ink);padding:12px 16px;font-weight:700}.btn:hover{border-color:var(--purple)}.btn.primary{background:var(--purple);color:white;border-color:var(--purple)}.btn.wide{width:100%}.btn.ghost{background:transparent}.row{display:flex;gap:10px;align-items:center}.row>*{min-width:0}.stack{display:grid;gap:9px}.actions{margin-top:23px}
textarea{width:100%;min-height:155px;border:1px solid #e5cdd3;border-radius:14px;background:white;padding:15px;resize:vertical;outline:none;line-height:1.5}textarea:focus{border-color:var(--purple)}
.progress-head{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--sub);margin-bottom:7px}.track{height:7px;border-radius:50px;background:#f2e3e7;overflow:hidden}.fill{height:100%;background:var(--purple);border-radius:50px;transition:width .2s}.question{font-weight:750;font-size:18px;margin:26px 0 14px}.choices{display:grid;gap:9px}.choice{width:100%;border:1px solid var(--line);border-radius:13px;background:white;padding:13px 15px;text-align:left;display:flex;align-items:center;gap:12px}.choice.selected{border-color:var(--purple);background:var(--lav)}.circle{flex:0 0 20px;width:20px;height:20px;border:1px solid #ceb9bd;border-radius:50%}.choice.selected .circle{border:6px solid var(--purple)}
.summary{background:var(--lav);border-radius:20px;padding:20px;margin:18px 0 25px}.summary strong{font-size:32px;line-height:1}.summary p{margin:10px 0 0;color:#76545d}.section-row{display:flex;align-items:center;justify-content:space-between;margin:25px 0 10px}.section-row h2{margin:0}.lesson-row{width:100%;background:white;border:1px solid var(--line);border-radius:15px;padding:15px;display:flex;align-items:center;gap:14px;text-align:left;margin:8px 0}.lesson-row:hover{border-color:var(--purple)}.number{width:39px;height:39px;border-radius:12px;background:var(--lav);color:var(--purple);display:grid;place-items:center;font-weight:800;flex-shrink:0}.lesson-row small{display:block;color:var(--sub);margin-top:2px}.lesson-row strong{font-size:14px}.checkpoint{background:#fffaf2}.checkpoint .number{background:var(--peach);color:#a56139}
.story{font-size:17px;line-height:1.75}.term-title{font-weight:800;font-size:16px;margin-bottom:8px}.term-text{line-height:1.6}.answer-line{margin:6px 0;padding:7px 10px;background:#fff5f6;border-radius:7px}.score{font-size:52px;font-weight:850;line-height:1;color:var(--purple)}.error{background:#fff0ef;border:1px solid #ffccca;color:#982b2b;border-radius:11px;padding:12px;margin:12px 0}.loading{padding:40px 0;color:var(--sub)}footer{border-top:1px solid var(--line);padding:12px 25px;display:flex;gap:8px;justify-content:center;background:#fff}.nav{border:0;background:transparent;color:var(--sub);padding:8px 16px;font-weight:650}.nav.active{color:var(--purple)}
.welcome{min-height:70vh;display:flex;flex-direction:column;justify-content:center}.welcome-panel{position:relative;overflow:hidden;min-height:340px;padding:35px 24px;background:radial-gradient(circle at 82% 47%,#ffe0e5 0,#fff5f7 31%,#fff 68%);border:1px solid var(--line);border-radius:24px}.welcome-panel h1{font-size:30px;max-width:265px;position:relative;z-index:1}.welcome-panel p{color:var(--purple);font-size:15px;font-weight:750;position:relative;z-index:1}.welcome-panel img{position:absolute;width:245px;right:-36px;bottom:-19px;filter:drop-shadow(0 15px 20px #a41c2920)}.welcome .actions{margin-top:20px}
@media(max-width:500px){body{background:var(--paper)}.shell{box-shadow:none}main{padding:20px 20px 38px}header,footer{padding-left:20px;padding-right:20px}}
</style>
</head><body>
<div class="shell"><header><span class="logo"><img class="brand-mark" src="/assets/logo.png" alt="">FinStory</span></header><main id="app"></main><footer id="nav"></footer></div>
<script>
const app=document.getElementById('app'),nav=document.getElementById('nav');
function stored(key,fallback){try{const x=JSON.parse(localStorage.getItem(key));return x===null?fallback:x}catch{return fallback}}
const state={request:0,cache:stored('finstory_v3_cache',{}),answer:localStorage.getItem('finstory_v3_answer')||'',interest:localStorage.getItem('finstory_v3_interest')||'',level:localStorage.getItem('finstory_v3_level')||'',character:stored('finstory_v3_character',null),stories:stored('finstory_v3_stories',{}),completed:stored('finstory_v3_completed',[]),lessons:[],entry:[],entryAnswers:[],number:1,questions:[],answers:[]};
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function api(path,body){let r=await fetch(path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});let data=await r.json();if(!r.ok)throw Error(data.error||'Что-то пошло не так');return data}
function showError(e){const box=document.createElement('div');box.className='error';box.textContent=e.message;app.prepend(box)}
function setNav(active){nav.innerHTML=state.level?`<button class="nav ${active==='course'?'active':''}" onclick="course()">Курс</button><button class="nav ${active==='profile'?'active':''}" onclick="profile()">Профиль</button>`:'';nav.style.display=state.level?'flex':'none'}
function welcome(){nav.style.display='none';app.innerHTML=`<div class="welcome"><div class="welcome-panel"><h1>Финансы в историях</h1><p>Все темы в одном месте</p><img src="/assets/mascot.png" alt="Красный персонаж FinStory"></div><div class="actions"><button class="btn primary wide" onclick="intro()">Начать →</button></div></div>`}
function intro(){state.request++;nav.style.display='none';app.innerHTML=`<div class="eyebrow">Начнём с тебя</div><p class="muted">Расскажи о своих интересах</p><div class="card warm"><h3>Чем увлекаешься?</h3><p>Постарайся перечислить все свои любимые хобби.</p><textarea id="hobbies" maxlength="800" placeholder="Например: люблю аниме, рисую, хожу в музеи и хочу побывать в Японии">${esc(state.answer)}</textarea></div><div class="actions"><button class="btn primary wide" onclick="startEntry()">Продолжить →</button></div>`}
async function startEntry(){const answer=document.getElementById('hobbies').value.trim();if(!answer){showError(Error('Расскажи о своих увлечениях'));return}state.answer=answer;app.innerHTML='<p class="loading">Подбираем темы…</p>';try{const [interest,entry]=await Promise.all([api('/api/interest',{answer}),api('/api/entry')]);state.interest=interest.interest;state.entry=entry;state.entryAnswers=Array(5).fill(null);renderEntry(0)}catch(e){intro();showError(e)}}
function renderEntry(index){setNav('');const q=state.entry[index];app.innerHTML=`<div class="progress-head"><span>Небольшая проверка</span><span>${index+1} / 5</span></div><div class="track"><div class="fill" style="width:${(index+1)*20}%"></div></div><div class="question">${esc(q.question)}</div><div class="choices">${q.answers.map((a,j)=>`<button class="choice ${state.entryAnswers[index]===j?'selected':''}" onclick="selectEntry(${index},${j})"><span class="circle"></span>${esc(a)}</button>`).join('')}</div><div class="actions"><button class="btn primary wide" onclick="nextEntry(${index})">${index===4?'К курсу →':'Дальше →'}</button></div>`}
function selectEntry(i,j){state.entryAnswers[i]=j;renderEntry(i)}
async function nextEntry(i){if(state.entryAnswers[i]===null){showError(Error('Выбери один ответ'));return}if(i<4){renderEntry(i+1);return}try{const result=await api('/api/entry-grade',{answers:state.entryAnswers});state.level=result.level;state.character=null;state.stories={};state.completed=[];state.cache={};localStorage.removeItem('finstory_v3_cache');localStorage.setItem('finstory_v3_answer',state.answer);localStorage.setItem('finstory_v3_interest',state.interest);localStorage.setItem('finstory_v3_level',state.level);localStorage.removeItem('finstory_v3_character');localStorage.removeItem('finstory_v3_stories');localStorage.removeItem('finstory_v3_completed');entryResult(result.score)}catch(e){showError(e)}}
function entryResult(score){nav.style.display='none';app.innerHTML=`<div class="eyebrow">Знакомство завершено</div><h1>Твой результат</h1><div class="card soft"><div class="score">${score} / 5</div><p>Правильных ответов</p></div><button class="btn primary wide actions" onclick="course()">Перейти к урокам →</button>`}
function course(){state.request++;if(!state.level){welcome();return}setNav('course');const count=state.completed.filter(n=>Number.isInteger(n)).length;app.innerHTML=`<div class="eyebrow">Твой маршрут</div><h1>Финансы шаг за шагом</h1><div class="summary"><div class="progress-head"><span>Пройдено уроков</span><strong>${count} / ${state.lessons.length}</strong></div><div class="track"><div class="fill" style="width:${count/state.lessons.length*100}%"></div></div><p>Читай истории, разбирай понятия и проверяй себя.</p></div><div class="section-row"><h2>Уроки</h2><span class="muted">${state.lessons.length} тем</span></div>${state.lessons.map(l=>`<button class="lesson-row" onclick="openLesson(${l.id})"><span class="number">${l.id}</span><span><strong>${esc(l.title)}</strong>${state.completed.includes(l.id)?'<small>Пройден</small>':''}</span></button>${l.id%3===0?`<button class="lesson-row checkpoint" onclick="openTest(${l.id},true)"><span class="number">✓</span><span><strong>Повторение: уроки ${l.id-2}–${l.id}</strong><small>7 коротких вопросов</small></span></button>`:''}`).join('')}`}
function profile(){state.request++;setNav('profile');app.innerHTML=`<div class="eyebrow">Мои данные</div><h1>Профиль</h1><div class="card"><h3>Увлечения</h3><p>${esc(state.answer)}</p></div><div class="card"><h3>Уровень</h3><p>${esc(state.level)}</p></div><div class="card"><h3>Прогресс</h3><p>${state.completed.filter(n=>Number.isInteger(n)).length} из ${state.lessons.length} уроков</p></div><button class="btn" onclick="intro()">Пройти опрос заново</button>`}
async function openLesson(number){const ticket=++state.request;state.number=number;setNav('course');app.innerHTML='<p class="loading">Готовим урок…</p>';try{const x=state.cache[number]||await api('/api/lesson',{number,answer:state.answer,interest:state.interest,character:state.character,previous_story:state.stories[number-1]||''});if(ticket!==state.request)return;state.cache[number]=x;localStorage.setItem('finstory_v3_cache',JSON.stringify(state.cache));state.character=x.character;state.stories[number]=x.story;localStorage.setItem('finstory_v3_character',JSON.stringify(x.character));localStorage.setItem('finstory_v3_stories',JSON.stringify(state.stories));app.innerHTML=`<button class="btn ghost" onclick="course()">← К урокам</button><div class="eyebrow" style="margin-top:25px">Урок ${number} из ${state.lessons.length}</div><h1>${esc(state.lessons[number-1].title)}</h1><div class="card"><div class="eyebrow">История</div><div class="story">${esc(x.story)}</div></div><div class="section-row"><h2>Понятия</h2></div>${x.terms.map(t=>`<div class="card"><div class="term-title">${esc(t.term)}</div><div class="term-text">${esc(t.text||t.definition+' '+t.example)}</div></div>`).join('')}<button class="btn primary wide actions" onclick="openTest(${number},false)">Проверить себя →</button>`}catch(e){if(ticket===state.request){course();showError(e)}}}
async function openTest(number,checkpoint=false){state.number=number;state.checkpoint=checkpoint;setNav('course');try{state.questions=await api('/api/questions',{number,checkpoint});state.answers=Array(state.questions.length).fill(null);renderTest(0)}catch(e){course();showError(e)}}
function renderTest(i){state.quizIndex=i;const q=state.questions[i];app.innerHTML=`<button class="btn ghost" onclick="course()">← К урокам</button><div class="progress-head" style="margin-top:24px"><span>${state.checkpoint?'Повторение':'Проверка урока'}</span><span>${i+1} / ${state.questions.length}</span></div><div class="track"><div class="fill" style="width:${(i+1)/state.questions.length*100}%"></div></div><div class="question">${esc(q.question)}</div><div class="choices">${q.answers.map((a,j)=>`<button class="choice ${state.answers[i]===j?'selected':''}" onclick="choose(${i},${j})"><span class="circle"></span>${esc(a)}</button>`).join('')}</div><div class="actions"><button class="btn primary wide" onclick="nextTest(${i})">${i===state.questions.length-1?'Показать результат':'Дальше'} →</button></div>`}
function choose(i,j){state.answers[i]=j;renderTest(i)}function nextTest(i){if(state.answers[i]===null){showError(Error('Выбери один ответ'));return}if(i+1<state.questions.length){renderTest(i+1);return}finishTest()}
async function finishTest(){try{const x=await api('/api/grade',{number:state.number,checkpoint:state.checkpoint,answers:state.answers});if(!state.checkpoint&&!state.completed.includes(state.number)){state.completed.push(state.number);localStorage.setItem('finstory_v3_completed',JSON.stringify(state.completed))}app.innerHTML=`<div class="eyebrow">Готово</div><h1>Результат</h1><div class="card soft"><div class="score">${x.correct} / ${x.total}</div><p>Верных ответов</p></div><h2>Разбор</h2>${state.questions.map((q,i)=>`<div class="card"><strong>${i+1}. ${esc(q.question)}</strong><p class="answer-line">${esc(x.right_answers[i])}</p></div>`).join('')}<button class="btn primary wide" onclick="course()">К урокам</button>`}catch(e){showError(e)}}
Promise.all([api('/api/lessons'),api('/api/status')]).then(([lessons,status])=>{if(localStorage.getItem('finstory_cache_version')!==status.cache_version){state.cache={};state.character=null;state.stories={};state.completed=[];for(const key of ['cache','character','stories','completed'])localStorage.removeItem('finstory_v3_'+key);localStorage.setItem('finstory_cache_version',status.cache_version)}state.lessons=lessons;state.level?course():welcome()}).catch(showError);
</script></body></html>
